[package]
name = "emusync-ffi"
description = "C ABI for emusync (see include/emusync.h)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "emusync"
# The shared library is a supported output, built on demand with `cargo rustc -p emusync-ffi --lib
# --release --crate-type cdylib` (as scripts/build-android.sh and
# bindings/cmake/EmuSyncAndroid.cmake do), because listing it here would collide on Windows with
# the `emusync` CLI binary: both would write target/*/emusync.pdb (cargo#6313).
crate-type = ["rlib", "staticlib"]

[dependencies]
emusync-core.workspace = true
emusync-formats.workspace = true
emusync-remote.workspace = true
log.workspace = true
zeroize.workspace = true

[dev-dependencies]
cc = "1"
tempfile.workspace = true
