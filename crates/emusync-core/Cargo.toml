[package]
name = "emusync-core"
description = "emusync data model, sync engine, and local state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
emusync-formats.workspace = true
emusync-remote.workspace = true
argon2.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
fastcdc.workspace = true
getrandom.workspace = true
hex.workspace = true
log.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
zstd.workspace = true

# The local copy of a repository key is protected with DPAPI (DESIGN section 22).
# Host secrets go to the system's credential store (DESIGN section 24): Credential Manager,
# the Keychain, the Secret Service (pure-Rust D-Bus, so no libdbus at build or run time).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "async-io", "crypto-rust"] }

# On Apple arm64, BLAKE3's NEON code is C that calls back into Rust through a #[no_mangle]
# function, and rustc exports every #[no_mangle] function from a cdylib on macOS, where no linker
# option takes one back out of its export list. The portable code keeps libemusync.dylib's exports
# to the es_* functions (scripts/check-desktop-lib.sh); hashing save-sized data is no slower in
# any way that matters. Elsewhere the symbol stays hidden: --exclude-libs on Linux and Android.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
blake3 = { workspace = true, features = ["no_neon"] }

[dev-dependencies]
tempfile.workspace = true
