# A GitHub Release for a version tag (vX.Y.Z, matching the workspace version in Cargo.toml),
# with the Android AAR that hosts download by version and checksum (DESIGN §26.5):
#   emusync-X.Y.Z.aar, emusync.h, SHA256SUMS
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the workspace version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (Cargo.toml)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-37.0" "cmake;3.31.6" > /dev/null
      - name: Build the AAR
        working-directory: bindings/android
        run: ./gradlew --no-daemon :emusync:assembleRelease
      - name: Check the AAR
        run: |
          mkdir aar && unzip -q bindings/android/emusync/build/outputs/aar/emusync-release.aar -d aar
          grep -q "\"version\":\"${{ steps.version.outputs.version }}\"" aar/prefab/prefab.json
          cmp aar/prefab/modules/emusync/include/emusync.h include/emusync.h
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          scripts/check-android-so.sh aar/prefab/modules/emusync/libs/android.arm64-v8a/libemusync.so \
            aar/prefab/modules/emusync/libs/android.x86_64/libemusync.so \
            aar/jni/arm64-v8a/libemusync.so aar/jni/x86_64/libemusync.so
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir dist
          cp bindings/android/emusync/build/outputs/aar/emusync-release.aar "dist/emusync-$v.aar"
          cp include/emusync.h dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "emusync $v" --notes \
            "Android AAR (arm64-v8a, x86_64; minSdk 24): libemusync.so for the host's native code as jniLibs and a Prefab package, and the Kotlin API. See the README's \"The Android AAR\" section and DESIGN §26."
