name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the C ABI checks (crates/emusync-ffi/tests/c_abi.rs): a C smoke test and a C++
      # compile of include/emusync.h, built with this runner's C compiler against the static library.
      # EMUSYNC_TEST_OS_SECRETS lets the host-secret tests write to the runner's credential store:
      # Credential Manager on Windows, the Keychain on macOS. Linux runners have no Secret
      # Service, so there they test the fallback file.
      - run: cargo test --workspace
        env:
          EMUSYNC_TEST_OS_SECRETS: "1"
      - name: Build the C ABI as a shared library
        run: cargo rustc -p emusync-ffi --lib --crate-type cdylib

  # The desktop shared library, the way PCSX2, Dolphin and PPSSPP link it: through
  # bindings/cmake/EmuSync.cmake (a consumer project that builds and runs the C smoke test against
  # it), and as the package scripts/build-desktop.sh stages for non-CMake builds (MSBuild).
  desktop:
    name: desktop library (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Visual Studio generator: multi-config, like PCSX2's own Windows builds.
          - os: windows-latest
            cmake_args: ""
            package_args: ""
          # A universal library, which is what macOS apps ship.
          - os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            package_args: --target aarch64-apple-darwin --target x86_64-apple-darwin
          - os: ubuntu-latest
            cmake_args: ""
            package_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin, x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and run the smoke test with bindings/cmake/EmuSync.cmake
        shell: bash
        run: |
          cmake -S bindings/cmake/desktop-test -B build/desktop -DCMAKE_BUILD_TYPE=Release             -DEMUSYNC_CARGO_TARGET_DIR="$PWD/target" ${{ matrix.cmake_args }}
          cmake --build build/desktop --config Release
          ctest --test-dir build/desktop -C Release --output-on-failure
      - name: Package with scripts/build-desktop.sh
        shell: bash
        run: scripts/build-desktop.sh --out dist ${{ matrix.package_args }}
      - name: Check the library
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              scripts/check-desktop-lib.sh dist/lib/libemusync.so
              smoke=$(find build/desktop -name emusync_smoke -type f | head -1)
              readelf -d "$smoke" | grep -q 'NEEDED.*\[libemusync\.so\]' || { echo "::error::the smoke test does not need libemusync.so by name"; exit 1; }
              ;;
            macOS)
              scripts/check-desktop-lib.sh dist/lib/libemusync.dylib "arm64 x86_64"
              ;;
            Windows)
              test -f dist/bin/emusync.dll && test -f dist/lib/emusync.lib && test -f dist/include/emusync.h
              ;;
          esac
      - name: The CMake module switches itself off without the Rust target
        if: runner.os == 'Linux'
        run: |
          cmake -S bindings/cmake/desktop-test -B build/off -DEMUSYNC_RUST_TARGET=riscv64gc-unknown-linux-gnu             -DEMUSYNC_EXPECT_FOUND=OFF | tee off.log
          grep -q "emusync: Rust target riscv64gc-unknown-linux-gnu not installed -> DISABLED" off.log
      - uses: actions/upload-artifact@v4
        with:
          name: libemusync-desktop-${{ runner.os }}
          path: dist/

  # libemusync.so for Android, the way ARMSX2 links it (docs/research/armsx2.md §4). The ELF
  # checks are in scripts/check-android-so.sh.
  android:
    name: Android (libemusync.so)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865 # the NDK ARMSX2 pins
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install the Android NDK and Ninja
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          command -v ninja || sudo apt-get install -y ninja-build
      - name: Build with scripts/build-android.sh
        run: scripts/build-android.sh --target aarch64-linux-android --target x86_64-linux-android --out dist
      - name: Check the libraries
        run: scripts/check-android-so.sh dist/arm64-v8a/libemusync.so dist/x86_64/libemusync.so
      - name: Build with bindings/cmake/EmuSyncAndroid.cmake
        run: |
          for abi in arm64-v8a x86_64; do
            cmake -S bindings/cmake/android-test -B "build/$abi" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release \
              -DEMUSYNC_CARGO_TARGET_DIR="$PWD/target"
            cmake --build "build/$abi"
          done
      - name: Check the CMake build
        run: |
          scripts/check-android-so.sh build/arm64-v8a/libs/arm64-v8a/libemusync.so build/x86_64/libs/x86_64/libemusync.so
          # A host linked against it must record the bare soname, which is what Android looks up.
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for f in build/arm64-v8a/libs/arm64-v8a/libemusync_host.so build/arm64-v8a/emusync_smoke; do
            "$readelf" -d "$f" | grep NEEDED
            "$readelf" -d "$f" | grep -q 'NEEDED.*\[libemusync\.so\]' || { echo "::error::$f does not need libemusync.so by name"; exit 1; }
          done
      - name: The CMake module switches itself off without the Rust target
        run: |
          cmake -S bindings/cmake/android-test -B build/off -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-26 -DEMUSYNC_EXPECT_FOUND=OFF | tee off.log
          grep -q "emusync: Rust target armv7-linux-androideabi not installed -> DISABLED" off.log
      - name: Stage the artifacts
        run: |
          mkdir -p dist/include smoke-x86_64
          cp include/emusync.h dist/include/
          cp build/x86_64/libs/x86_64/libemusync.so build/x86_64/emusync_smoke smoke-x86_64/
      - uses: actions/upload-artifact@v4
        with:
          name: libemusync-android
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: android-smoke-x86_64
          path: smoke-x86_64/
          retention-days: 1

  # The C smoke test against libemusync.so on an x86_64 emulator. An arm64 image cannot run on
  # x86_64 runners, so the arm64 library is covered by the ELF checks above.
  android-emulator:
    name: Android emulator (C smoke test)
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-smoke-x86_64
          path: smoke
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/android_smoke.sh smoke

  s3-moto:
    name: S3 tests (moto)
    runs-on: ubuntu-latest
    env:
      MOTO_ENDPOINT: http://127.0.0.1:5056
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install moto
        run: pip install "moto[server]" boto3
      # No HTTP readiness probe here: it would use up one of the 3 unauthenticated calls.
      # moto_setup.py waits for the port itself.
      - name: Start moto
        run: INITIAL_NO_AUTH_ACTION_COUNT=3 nohup moto_server -p 5056 > moto.log 2>&1 &
      - name: Create IAM user, access key and bucket
        run: |
          python .github/scripts/moto_setup.py "$MOTO_ENDPOINT" emusync-test > creds.env
          while IFS='=' read -r _ value; do echo "::add-mask::$value"; done < creds.env
          cat creds.env >> "$GITHUB_ENV"
          rm creds.env
      - name: cargo test (gated S3 tests enabled)
        env:
          EMUSYNC_S3_TEST_URI: s3://emusync-test/ci?endpoint=http://127.0.0.1:5056&path_style=1
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test.log
          if grep -q "skipped: EMUSYNC_S3_TEST_URI" test.log; then
            echo "::error::gated S3 tests were skipped"
            exit 1
          fi
      - name: moto log
        if: failure()
        run: cat moto.log
