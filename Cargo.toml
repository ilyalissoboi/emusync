[workspace]
resolver = "2"
members = [
    "crates/emusync-core",
    "crates/emusync-formats",
    "crates/emusync-remote",
    "crates/emusync-ffi",
    "crates/emusyncd",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ilyalissoboi/emusync"
rust-version = "1.80"

[workspace.dependencies]
emusync-core = { path = "crates/emusync-core" }
emusync-formats = { path = "crates/emusync-formats" }
emusync-remote = { path = "crates/emusync-remote" }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "6"
fastcdc = "3"
getrandom = "0.4"
hex = "0.4"
# 3.x: 4.x needs Rust 1.88. No default features; each platform picks its store (emusync-core).
keyring = { version = "3.6", default-features = false }
log = "0.4"
notify = "8"
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"
ureq = "2"
uuid = { version = "1", features = ["v7"] }
windows-sys = "0.61"
zeroize = "1"
zstd = { version = "0.13", default-features = false }
tempfile = "3"

# Argon2id runs on every passphrase entry (and in tests); unoptimised it takes seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
